[package]
name = "ladepa-core"
version = "0.1.0"
edition = "2021"
description = "Shared kernel of the ladepa services: error model, request context, transaction / messaging / cache contracts"
license = "MIT"
authors = ["PAN JIE <sanbaikuai@gmail.com>"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v5"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
